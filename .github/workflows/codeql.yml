# Advanced Code Scanning (CodeQL) — fleet security standard.
# security-extended + security-and-quality strictly subsumes the default suite
# and the extended suite.
#
# Matrix covers every language that can actually be analyzed here:
#   - python (Meta/ tooling, 163 files) and javascript-typescript (LibJS test
#     corpus and tooling JS) extract without a native build.
#   - rust is the production Rust workspace at the repo root (Libraries/*/Rust,
#     Cargo.lock present) and builds standalone via cargo.
#   - c-cpp CANNOT be analyzed on this account's runners: a Lagom build
#     requires a cold vcpkg manifest install (ffmpeg, skia, icu, curl, ...)
#     that alone exceeds the 6-hour job limit on free 4-vCPU runners; upstream
#     runs it on 16-vCPU Blacksmith runners inside a prebuilt CI container with
#     ccache/vcpkg caches, and its CI jobs are gated with
#     `if: github.repository == 'LadybirdBrowser/ladybird'` (they never run on
#     this fork). Default-setup would fail for the same build reason, so this
#     is a documented gap, not a configuration choice.
name: CodeQL Advanced

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "34 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all features
      security-events: write
      # only required for workflows in private repositories
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # Rust only supports build-mode "none" in CodeQL (standalone
          # extraction); "manual" is rejected by database init.
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          build-mode: ${{ matrix.build-mode }}
          # Tests/ holds vendored third-party corpora (WebKit test fixtures,
          # test262, LibJS test data) — generated/vendored material, not
          # authored code; analyzing it with the quality suite only yields
          # noise about files this project does not maintain.
          config: |
            paths-ignore:
              - Tests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
